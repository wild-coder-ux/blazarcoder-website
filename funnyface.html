<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FUNNY FACE — Face Warp Filters</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0a0a;--panel:#111;--accent:#ff3d00;
  --txt:#fff;--muted:#666;--card:#1a1a1a;--border:#222;
}
body{background:var(--bg);color:var(--txt);font-family:'Arial Black',Impact,sans-serif;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none;}

/* ── HEADER ── */
#hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;flex-shrink:0;border-bottom:1px solid var(--border);
  background:var(--panel);
}
.logo{font-size:22px;font-weight:900;letter-spacing:-1px;color:#fff;
  text-shadow:2px 2px 0 var(--accent);}
.logo span{color:var(--accent);}
.hbtn{background:var(--card);border:1px solid var(--border);color:var(--muted);
  width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:all .15s;}
.hbtn:hover{color:#fff;border-color:#444;}

/* ── VIDEO STAGE ── */
#stage{position:relative;flex:1;overflow:hidden;background:#000;}
#video{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;transform:scaleX(-1);visibility:hidden;}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
#status{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;z-index:5;
}
.status-icon{font-size:48px;margin-bottom:12px;}
.status-txt{font-size:13px;color:#aaa;letter-spacing:.05em;}
.status-sub{font-size:11px;color:#555;margin-top:6px;}

/* Filter name tag */
#ftag{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  background:rgba(255,61,0,0.85);color:#fff;font-size:11px;
  font-weight:900;letter-spacing:.12em;text-transform:uppercase;
  padding:5px 16px;border-radius:4px;pointer-events:none;z-index:5;
  white-space:nowrap;
}
/* Landmark count */
#lm-dot{
  position:absolute;top:10px;right:10px;width:8px;height:8px;
  border-radius:50%;background:#ff3d00;z-index:6;
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(0.7);}}
#lm-dot.inactive{background:#333;animation:none;}

/* ── BOTTOM PANEL ── */
#panel{
  background:var(--panel);border-top:1px solid var(--border);
  flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,4px);
}
/* Filter strip */
#fstrip{
  display:flex;gap:8px;overflow-x:auto;padding:10px 12px 6px;
  scrollbar-width:none;
}
#fstrip::-webkit-scrollbar{display:none;}
.fcard{
  flex-shrink:0;width:72px;cursor:pointer;text-align:center;
  transition:transform .12s;
}
.fcard:hover{transform:scale(1.06);}
.fcard.active .fface{border-color:#ff3d00;box-shadow:0 0 12px rgba(255,61,0,.5);}
.fface{
  width:72px;height:72px;border-radius:10px;border:2px solid var(--border);
  background:var(--card);overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;transition:border-color .15s;
}
.fname{font-size:9px;color:var(--muted);margin-top:4px;
  font-family:Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;}

/* Action row */
#abar{
  display:flex;align-items:center;justify-content:space-around;
  padding:6px 20px 10px;
}
.abtn{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.abtn:hover .aicon{background:#222;}
.aicon{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--border);
  background:var(--card);display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:background .15s;}
.albl{font-size:9px;color:var(--muted);font-family:Arial,sans-serif;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
#shutter{
  width:64px;height:64px;border-radius:50%;border:3px solid #fff;
  background:transparent;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .12s;
}
#shutter:hover{background:rgba(255,255,255,.1);}
#shutter:active{transform:scale(.93);}
#shutter-in{width:50px;height:50px;border-radius:50%;background:#fff;}

/* Intensity slider */
#introw{
  display:flex;align-items:center;gap:10px;padding:0 14px 4px;
}
.intlbl{font-size:9px;color:var(--muted);font-family:Arial,sans-serif;
  font-weight:700;text-transform:uppercase;letter-spacing:.06em;width:50px;}
input[type=range]{
  flex:1;-webkit-appearance:none;height:3px;border-radius:2px;cursor:pointer;
  background:linear-gradient(90deg,#ff3d00 var(--pct,70%),#333 var(--pct,70%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:#fff;border:2px solid #ff3d00;
}
.intval{font-size:9px;color:var(--muted);font-family:Arial,sans-serif;width:22px;text-align:right;}

/* Flash */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;
  z-index:999;transition:opacity .05s;}
#flash.go{opacity:.85;transition:opacity .5s ease-out;}

/* Toast */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.9);border:1px solid #333;color:#fff;
  font-size:11px;padding:8px 18px;border-radius:6px;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:998;
  font-family:Arial,sans-serif;white-space:nowrap;}
#toast.show{opacity:1;}

/* Perm overlay */
#perm{position:fixed;inset:0;background:#0a0a0a;z-index:990;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#perm.gone{display:none;}
.perm-emoji{font-size:56px;animation:bounce .7s ease infinite alternate;}
@keyframes bounce{0%{transform:translateY(0);}100%{transform:translateY(-14px);}}
.perm-h{font-size:24px;font-weight:900;letter-spacing:-1px;}
.perm-h span{color:var(--accent);}
.perm-p{font-size:13px;color:#777;font-family:Arial,sans-serif;text-align:center;max-width:260px;line-height:1.6;}
#perm-btn{
  background:var(--accent);color:#fff;border:none;cursor:pointer;
  font-family:'Arial Black',sans-serif;font-size:13px;font-weight:900;
  letter-spacing:.1em;padding:14px 32px;border-radius:8px;margin-top:6px;
  text-transform:uppercase;transition:filter .15s;
}
#perm-btn:hover{filter:brightness(1.2);}
</style>
</head>
<body>

<div id="flash"></div>
<div id="toast"></div>

<!-- Permission screen -->
<div id="perm">
  <div class="perm-emoji">😜</div>
  <div class="perm-h">FUNNY<span>FACE</span></div>
  <div class="perm-p">Real-time face warping using your camera.<br>No photos stored anywhere.</div>
  <button id="perm-btn" onclick="boot()">Allow Camera</button>
</div>

<!-- App -->
<div id="hdr">
  <div class="logo">FUNNY<span>FACE</span></div>
  <div style="display:flex;gap:6px;">
    <div class="hbtn" onclick="flip()" title="Flip">⟳</div>
    <div class="hbtn" onclick="save()" title="Save">↓</div>
  </div>
</div>

<div id="stage">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="lm-dot" class="inactive"></div>
  <div id="ftag">Select a filter</div>
  <div id="status">
    <div class="status-icon">🎭</div>
    <div class="status-txt">Loading face engine…</div>
    <div class="status-sub">Using MediaPipe FaceMesh</div>
  </div>
</div>

<div id="panel">
  <div id="fstrip"></div>
  <div id="introw">
    <div class="intlbl">Intensity</div>
    <input type="range" id="intslider" min="10" max="200" value="100" step="1"
      oninput="onInt(this)">
    <div class="intval" id="intval">100</div>
  </div>
  <div id="abar">
    <div class="abtn" onclick="flip()">
      <div class="aicon">⟳</div>
      <div class="albl">Flip</div>
    </div>
    <div id="shutter" onclick="shoot()"><div id="shutter-in"></div></div>
    <div class="abtn" onclick="save()">
      <div class="aicon">↓</div>
      <div class="albl">Save</div>
    </div>
  </div>
</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

<script>
'use strict';

// ── CONFIG ────────────────────────────────────────────────────────────────
const FILTERS = [
  { id:'none',    name:'Normal',   emoji:'😐', desc:'No filter',            warp: null },
  { id:'bigEyes', name:'Bug Eyes', emoji:'👀', desc:'Huge bulging eyes',     warp: warpBigEyes },
  { id:'tinEyes', name:'Tiny Eyes',emoji:'🔬', desc:'Squished tiny eyes',    warp: warpTinyEyes },
  { id:'bigNose', name:'Big Nose', emoji:'🐽', desc:'Enormous nose',         warp: warpBigNose },
  { id:'bigLip',  name:'Big Lips', emoji:'💋', desc:'Giant puffy lips',      warp: warpBigLips },
  { id:'fatFace', name:'Fat Face', emoji:'🥴', desc:'Wide fat face',         warp: warpFatFace },
  { id:'skull',   name:'Skull',    emoji:'💀', desc:'Stretched skull',       warp: warpSkull },
  { id:'alien',   name:'Alien',    emoji:'👽', desc:'Alien head shape',      warp: warpAlien },
  { id:'monkey',  name:'Monkey',   emoji:'🐒', desc:'Monkey expression',     warp: warpMonkey },
  { id:'angry',   name:'Angry',    emoji:'😤', desc:'Rage face warp',        warp: warpAngry },
  { id:'cute',    name:'Cute',     emoji:'🥺', desc:'Cute chibi face',       warp: warpCute },
  { id:'mew',     name:'Mewing',   emoji:'🫤', desc:'Sharp jawline',         warp: warpMewing },
];

const S = {
  activeFilter: 0,
  intensity: 1.0,
  facing: 'user',
  stream: null,
  landmarks: null,
  faceW: 0, faceH: 0,
  lastFrame: null,
  mp_camera: null,
};

const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const ftag   = document.getElementById('ftag');
const lmdot  = document.getElementById('lm-dot');
const status = document.getElementById('status');

// ── BOOT ──────────────────────────────────────────────────────────────────
async function boot(){
  document.getElementById('perm').classList.add('gone');
  buildStrip();
  initSlider();
  await startCam();
  initMesh();
}

async function startCam(){
  try {
    if(S.stream) S.stream.getTracks().forEach(t=>t.stop());
    S.stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:S.facing,width:{ideal:1280},height:{ideal:720}},audio:false
    });
    video.srcObject = S.stream;
    await video.play();
    resize();
  } catch(e){
    status.innerHTML='<div class="status-icon">❌</div><div class="status-txt">Camera denied</div>';
    document.getElementById('perm').classList.remove('gone');
  }
}

function resize(){
  const s=document.getElementById('stage');
  canvas.width=s.offsetWidth; canvas.height=s.offsetHeight;
}
window.addEventListener('resize',resize);

// ── MEDIAPIPE FACE MESH ───────────────────────────────────────────────────
let faceMesh;
function initMesh(){
  status.querySelector('.status-txt').textContent='Loading FaceMesh…';
  faceMesh = new FaceMesh({locateFile: f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  faceMesh.onResults(onResults);

  const cam = new Camera(video,{
    onFrame: async ()=>{ await faceMesh.send({image:video}); },
    width:640, height:480
  });
  cam.start().then(()=>{
    status.style.display='none';
    video.style.visibility='hidden';
  }).catch(e=>{
    status.querySelector('.status-txt').textContent='FaceMesh failed: '+e.message;
  });
}

// ── RESULT HANDLER ────────────────────────────────────────────────────────
function onResults(results){
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);

  // Draw mirrored video frame
  ctx.save();
  ctx.scale(-1,1);
  ctx.drawImage(results.image,-W,0,W,H);
  ctx.restore();

  if(results.multiFaceLandmarks && results.multiFaceLandmarks.length){
    lmdot.classList.remove('inactive');
    const lm = results.multiFaceLandmarks[0];
    S.landmarks = lm;

    const filter = FILTERS[S.activeFilter];
    if(filter.warp){
      applyWarp(ctx, results.image, lm, W, H, filter.warp, S.intensity);
    }
  } else {
    lmdot.classList.add('inactive');
  }

  // Store for capture
  S.lastFrame = canvas.toDataURL('image/jpeg',0.92);
}

// ── WARP ENGINE ───────────────────────────────────────────────────────────
// Core: takes the live frame, reads the landmark mesh,
// then for each region applies a bulge/shrink displacement,
// and composites the warped region back onto canvas.

function applyWarp(ctx, img, lm, W, H, warpFn, intensity){
  // Get warp commands [{cx,cy,radius,strength,mode}]
  const commands = warpFn(lm, W, H, intensity);

  // We composite warped patches using offscreen canvas
  const tmp = document.createElement('canvas');
  tmp.width=W; tmp.height=H;
  const tc = tmp.getContext('2d');
  tc.save(); tc.scale(-1,1); tc.drawImage(img,-W,0,W,H); tc.restore();

  const out = document.createElement('canvas');
  out.width=W; out.height=H;
  const oc2 = out.getContext('2d');
  oc2.drawImage(tmp,0,0);

  commands.forEach(cmd=>{
    warpRegion(tmp, oc2, cmd.cx, cmd.cy, cmd.radius, cmd.strength, cmd.mode);
  });

  ctx.clearRect(0,0,W,H);
  ctx.drawImage(out,0,0);
}

function warpRegion(src, dst, cx, cy, radius, strength, mode){
  // mode: 'bulge' | 'shrink' | 'stretch_x' | 'stretch_y' | 'shift'
  const r = Math.round(radius);
  const sx = Math.max(0, Math.round(cx-r)), sy = Math.max(0, Math.round(cy-r));
  const sw = Math.min(r*2, src.canvas.width-sx), sh = Math.min(r*2, src.canvas.height-sy);
  if(sw<=0||sh<=0) return;

  const src_id = src.getContext('2d').getImageData(sx,sy,sw,sh);
  const dst_id = dst.getImageData(sx,sy,sw,sh);
  const sd=src_id.data, dd=dst_id.data;

  for(let py=0;py<sh;py++){
    for(let px=0;px<sw;px++){
      // Coords relative to region centre
      const dx=(px-(sw/2))/(sw/2), dy=(py-(sh/2))/(sh/2);
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>1){
        // Outside circle: copy as-is
        const i=(py*sw+px)*4;
        // already correct from dst drawImage base, skip
        continue;
      }

      // Falloff: smooth at edges
      const falloff = Math.cos(dist*Math.PI*0.5);
      let sx2,sy2;

      if(mode==='bulge'){
        // Push pixels outward from centre
        const factor = 1 + strength*falloff;
        sx2 = (sw/2) + dx*sw/2/factor;
        sy2 = (sh/2) + dy*sh/2/factor;
      } else if(mode==='shrink'){
        // Pull pixels inward to centre
        const factor = 1 - strength*0.6*falloff;
        sx2 = (sw/2) + dx*sw/2*factor;
        sy2 = (sh/2) + dy*sh/2*factor;
      } else if(mode==='stretch_x'){
        sx2 = (sw/2) + dx*sw/2*(1+strength*falloff);
        sy2 = (sh/2) + dy*sh/2*(1-strength*0.3*falloff);
      } else if(mode==='stretch_y'){
        sx2 = (sw/2) + dx*sw/2*(1-strength*0.3*falloff);
        sy2 = (sh/2) + dy*sh/2*(1+strength*falloff);
      } else if(mode==='squish_x'){
        sx2 = (sw/2) + dx*sw/2*(1-strength*0.7*falloff);
        sy2 = (sh/2) + dy*sh/2*(1+strength*0.2*falloff);
      } else if(mode==='squish_y'){
        sx2 = (sw/2) + dx*sw/2*(1+strength*0.2*falloff);
        sy2 = (sh/2) + dy*sh/2*(1-strength*0.7*falloff);
      } else {
        sx2=px; sy2=py;
      }

      // Bilinear sample from source
      sx2=Math.max(0,Math.min(sw-1,sx2));
      sy2=Math.max(0,Math.min(sh-1,sy2));
      const x0=Math.floor(sx2), y0=Math.floor(sy2);
      const xf=sx2-x0, yf=sy2-y0;
      const x1=Math.min(sw-1,x0+1), y1=Math.min(sh-1,y0+1);

      const di=(py*sw+px)*4;
      for(let c=0;c<4;c++){
        const p00=sd[(y0*sw+x0)*4+c], p10=sd[(y0*sw+x1)*4+c];
        const p01=sd[(y1*sw+x0)*4+c], p11=sd[(y1*sw+x1)*4+c];
        dd[di+c]=p00*(1-xf)*(1-yf)+p10*xf*(1-yf)+p01*(1-xf)*yf+p11*xf*yf;
      }
    }
  }
  dst.putImageData(dst_id,sx,sy);
}

// ── LANDMARK HELPERS ──────────────────────────────────────────────────────
function lpt(lm, i, W, H){ return {x:lm[i].x*W, y:lm[i].y*H}; }
function lmid(lm, idxs, W, H){
  let x=0,y=0;
  idxs.forEach(i=>{x+=lm[i].x;y+=lm[i].y;});
  return {x:x/idxs.length*W, y:y/idxs.length*H};
}
function lmdist(lm, i, j, W, H){
  const a=lpt(lm,i,W,H),b=lpt(lm,j,W,H);
  return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);
}

// Key landmark indices (MediaPipe 468-point mesh)
const IDX = {
  leftEye:[33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246],
  rightEye:[362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398],
  leftEyeCtr:[468],  // refined
  rightEyeCtr:[473],
  nose:[1,2,98,327,115,344,94],
  noseTip:[4],
  noseWidth:[129,358],
  mouthOuter:[61,185,40,39,37,0,267,269,270,409,291,375,321,405,314,17,84,181,91,146],
  mouthCtr:[0],
  leftMouth:[61],
  rightMouth:[291],
  topLip:[0,37,267],
  chin:[152],
  forehead:[10],
  leftJaw:[234],
  rightJaw:[454],
  leftCheek:[117],
  rightCheek:[346],
};

// ── FILTER WARP FUNCTIONS ─────────────────────────────────────────────────
function warpBigEyes(lm,W,H,t){
  const le=lmid(lm,[33,133,159,145],W,H);
  const re=lmid(lm,[362,263,386,374],W,H);
  const er=lmdist(lm,33,133,W,H)*1.3;
  const s=t*0.7;
  return [
    {cx:le.x,cy:le.y,radius:er,strength:s,mode:'bulge'},
    {cx:re.x,cy:re.y,radius:er,strength:s,mode:'bulge'},
  ];
}

function warpTinyEyes(lm,W,H,t){
  const le=lmid(lm,[33,133,159,145],W,H);
  const re=lmid(lm,[362,263,386,374],W,H);
  const er=lmdist(lm,33,133,W,H)*1.1;
  const s=t*0.55;
  return [
    {cx:le.x,cy:le.y,radius:er,strength:s,mode:'shrink'},
    {cx:re.x,cy:re.y,radius:er,strength:s,mode:'shrink'},
  ];
}

function warpBigNose(lm,W,H,t){
  const n=lmid(lm,[1,4,2,98,327],W,H);
  const nr=lmdist(lm,129,358,W,H)*1.6;
  return [{cx:n.x,cy:n.y,radius:nr,strength:t*0.7,mode:'bulge'}];
}

function warpBigLips(lm,W,H,t){
  const mc=lmid(lm,[0,17,61,291],W,H);
  const mr=lmdist(lm,61,291,W,H)*1.0;
  const s=t*0.65;
  return [
    {cx:mc.x,cy:mc.y-mr*0.1,radius:mr*1.1,strength:s,mode:'stretch_y'},
    {cx:mc.x,cy:mc.y,radius:mr*1.2,strength:s*0.4,mode:'bulge'},
  ];
}

function warpFatFace(lm,W,H,t){
  const lc=lmid(lm,[234,127,162],W,H);
  const rc=lmid(lm,[454,356,389],W,H);
  const cr=lmdist(lm,234,454,W,H)*0.35;
  const s=t*0.55;
  return [
    {cx:lc.x,cy:lc.y,radius:cr,strength:s,mode:'stretch_x'},
    {cx:rc.x,cy:rc.y,radius:cr,strength:s,mode:'stretch_x'},
    // Also widen nose/cheeks
    {cx:(lc.x+rc.x)/2,cy:lc.y,radius:cr*2.5,strength:s*0.3,mode:'stretch_x'},
  ];
}

function warpSkull(lm,W,H,t){
  const top=lmid(lm,[10,67,109],W,H);
  const chin=lmid(lm,[152,175],W,H);
  const fr=lmdist(lm,10,234,W,H)*0.6;
  const cr=lmdist(lm,152,234,W,H)*0.5;
  const s=t*0.6;
  return [
    {cx:top.x,cy:top.y,radius:fr,strength:s,mode:'stretch_y'},   // big forehead
    {cx:chin.x,cy:chin.y,radius:cr,strength:s*0.8,mode:'squish_y'}, // squish chin
  ];
}

function warpAlien(lm,W,H,t){
  const top=lmid(lm,[10,67,109,338,297],W,H);
  const chin=lmid(lm,[152,175],W,H);
  const le=lmid(lm,[33,133,159,145],W,H);
  const re=lmid(lm,[362,263,386,374],W,H);
  const er=lmdist(lm,33,133,W,H)*1.4;
  const fr=lmdist(lm,10,234,W,H)*0.8;
  const s=t*0.6;
  return [
    {cx:top.x,cy:top.y,radius:fr,strength:s*0.8,mode:'stretch_y'},
    {cx:top.x,cy:top.y,radius:fr*0.7,strength:s*0.5,mode:'bulge'},
    {cx:le.x,cy:le.y,radius:er*1.1,strength:s*0.8,mode:'bulge'},
    {cx:re.x,cy:re.y,radius:er*1.1,strength:s*0.8,mode:'bulge'},
    {cx:chin.x,cy:chin.y,radius:er,strength:s*0.7,mode:'squish_y'},
  ];
}

function warpMonkey(lm,W,H,t){
  const n=lmid(lm,[1,4,2],W,H);
  const mc=lmid(lm,[0,17],W,H);
  const nr=lmdist(lm,129,358,W,H)*2.0;
  const mr=lmdist(lm,61,291,W,H)*1.2;
  const s=t*0.6;
  return [
    {cx:n.x,cy:n.y,radius:nr,strength:s*0.8,mode:'bulge'},  // big nose
    {cx:mc.x,cy:mc.y,radius:mr,strength:s*0.6,mode:'stretch_y'},  // big lips
    {cx:n.x,cy:n.y-nr,radius:nr*0.8,strength:s*0.3,mode:'shrink'}, // squish eyes
    // Ear region widening
    {cx:lmid(lm,[234],W,H).x,cy:lmid(lm,[234],W,H).y,radius:nr*0.8,strength:s*0.5,mode:'stretch_x'},
    {cx:lmid(lm,[454],W,H).x,cy:lmid(lm,[454],W,H).y,radius:nr*0.8,strength:s*0.5,mode:'stretch_x'},
  ];
}

function warpAngry(lm,W,H,t){
  const le=lmid(lm,[33,133,159,145],W,H);
  const re=lmid(lm,[362,263,386,374],W,H);
  const n=lmid(lm,[1,4],W,H);
  const er=lmdist(lm,33,133,W,H)*1.0;
  const nr=lmdist(lm,129,358,W,H)*1.2;
  const s=t*0.55;
  return [
    {cx:le.x+er*0.3,cy:le.y-er*0.2,radius:er*1.1,strength:s*0.5,mode:'bulge'},
    {cx:re.x-er*0.3,cy:re.y-er*0.2,radius:er*1.1,strength:s*0.5,mode:'bulge'},
    {cx:n.x,cy:n.y,radius:nr*1.5,strength:s*0.4,mode:'bulge'},
    // Squish brow area down
    {cx:(le.x+re.x)/2,cy:(le.y+re.y)/2-er,radius:er*2,strength:s*0.35,mode:'squish_y'},
  ];
}

function warpCute(lm,W,H,t){
  const le=lmid(lm,[33,133,159,145],W,H);
  const re=lmid(lm,[362,263,386,374],W,H);
  const mc=lmid(lm,[0,61,291],W,H);
  const er=lmdist(lm,33,133,W,H)*1.3;
  const mr=lmdist(lm,61,291,W,H)*0.7;
  const s=t*0.55;
  return [
    {cx:le.x,cy:le.y,radius:er,strength:s*0.7,mode:'bulge'},
    {cx:re.x,cy:re.y,radius:er,strength:s*0.7,mode:'bulge'},
    {cx:mc.x,cy:mc.y,radius:mr,strength:s*0.5,mode:'shrink'},  // tiny mouth
    // Squish forehead/head to make it rounder/chibi
    {cx:lmid(lm,[10],W,H).x,cy:lmid(lm,[10],W,H).y,radius:er*2,strength:s*0.4,mode:'squish_y'},
  ];
}

function warpMewing(lm,W,H,t){
  // Mewing = sharp jaw, high cheekbones, slightly squished face vertically
  const lj=lmid(lm,[234,132,172],W,H);
  const rj=lmid(lm,[454,361,397],W,H);
  const chin=lmid(lm,[152,175,148],W,H);
  const lc=lmid(lm,[117,118,101],W,H);
  const rc=lmid(lm,[346,347,330],W,H);
  const jr=lmdist(lm,234,454,W,H)*0.3;
  const s=t*0.5;
  return [
    {cx:lj.x,cy:lj.y,radius:jr,strength:s*0.6,mode:'squish_x'},   // sharpen left jaw
    {cx:rj.x,cy:rj.y,radius:jr,strength:s*0.6,mode:'squish_x'},   // sharpen right jaw
    {cx:chin.x,cy:chin.y,radius:jr*1.2,strength:s*0.5,mode:'squish_y'}, // sharpen chin point
    {cx:lc.x,cy:lc.y,radius:jr*1.2,strength:s*0.4,mode:'bulge'},  // raise cheekbones
    {cx:rc.x,cy:rc.y,radius:jr*1.2,strength:s*0.4,mode:'bulge'},
  ];
}

// ── UI ────────────────────────────────────────────────────────────────────
function buildStrip(){
  const strip=document.getElementById('fstrip');
  FILTERS.forEach((f,i)=>{
    const card=document.createElement('div');
    card.className='fcard'+(i===S.activeFilter?' active':'');
    card.innerHTML=`<div class="fface">${f.emoji}</div><div class="fname">${f.name}</div>`;
    card.onclick=()=>selectFilter(i,f,card);
    strip.appendChild(card);
  });
  updateTag();
}

function selectFilter(i,f,card){
  S.activeFilter=i;
  document.querySelectorAll('.fcard').forEach(c=>c.classList.remove('active'));
  card.classList.add('active');
  updateTag();
}

function updateTag(){
  const f=FILTERS[S.activeFilter];
  ftag.textContent=f.name+(f.id==='none'?'':' · '+f.desc);
}

function initSlider(){
  const sl=document.getElementById('intslider');
  sl.style.setProperty('--pct','70%');
}

function onInt(el){
  const v=parseInt(el.value);
  S.intensity=v/100;
  el.style.setProperty('--pct',((v-10)/(200-10)*100)+'%');
  document.getElementById('intval').textContent=v;
}

async function flip(){
  S.facing=S.facing==='user'?'environment':'user';
  if(S.mp_camera) await S.mp_camera.stop();
  await startCam();
}

function shoot(){
  const f=document.getElementById('flash');
  f.classList.add('go'); setTimeout(()=>f.classList.remove('go'),600);
  S.captureNext=true;
  toast('📸 Captured! Tap Save to download');
}

function save(){
  if(!S.lastFrame){ shoot(); return; }
  const a=document.createElement('a');
  a.href=S.lastFrame;
  a.download=`funnyface_${FILTERS[S.activeFilter].id}_${Date.now()}.jpg`;
  a.click();
  toast('💾 Saved!');
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// Try auto-start if permissions already granted
navigator.mediaDevices?.getUserMedia({video:true}).then(s=>{
  s.getTracks().forEach(t=>t.stop());
  boot();
}).catch(()=>{});
</script>
